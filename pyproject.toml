[project]
name = "rl-project"
version = "0.1.0"
description = "Reinforcement learning for Block Blast: DQN, DVN and PPO agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.2.3",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.8",
    "moviepy>=2.2.1",
    "numpy>=2.4.2",
    "seaborn>=0.13.2",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "tqdm>=4.67.3",
    "wandb>=0.25.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# packages importables après `uv sync` (ou `uv pip install -e .`) :
# blockblast, common, dqn, dvn, ...
[tool.setuptools.packages.find]
where = ["src"]
