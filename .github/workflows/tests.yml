name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      # CPU-only PyTorch: the default Linux wheels bundle CUDA (several GB).
      # uv.lock is not used here so that it keeps the GPU wheels for training.
      - name: Install
        run: |
          uv venv
          uv pip install --torch-backend=cpu -e . pytest

      - name: Unit tests
        run: uv run --no-sync pytest -m "not slow"

      # End-to-end runs of every script: only on demand (Actions tab > Run workflow).
      - name: End-to-end tests
        if: github.event_name == 'workflow_dispatch'
        run: uv run --no-sync pytest -m slow
